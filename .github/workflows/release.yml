name: Package Nextcloud app

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npx esbuild --bundle --minify --outdir=js index=src/map.ts admin=src/admin.ts maplibre-gl-worker=node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs

      - name: Validate PHP and app metadata
        run: |
          find appinfo lib templates test -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php test/appinfo.php
          php test/tracker-data.test.php
          php test/sms-gateway.test.php
          php test/webhook-controller.test.php

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(php -r 'echo simplexml_load_file("appinfo/info.xml")->version;')"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match appinfo version $APP_VERSION"
            exit 1
          fi

      - name: Assemble Nextcloud app directory
        run: |
          mkdir -p dist/live_tracker
          cp -R appinfo js lib templates dist/live_tracker/
          test -f dist/live_tracker/js/index.js
          test -f dist/live_tracker/js/index.css
          test -f dist/live_tracker/js/admin.js
          test -f dist/live_tracker/js/admin.css
          test -f dist/live_tracker/js/maplibre-gl-worker.js
          (cd dist && zip -qr ../live_tracker.zip live_tracker)
          unzip -l live_tracker.zip

      - name: Upload app package artifact
        uses: actions/upload-artifact@v4
        with:
          name: live_tracker
          path: live_tracker.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download app package
        uses: actions/download-artifact@v4
        with:
          name: live_tracker
          path: release

      - name: Attach package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/live_tracker.zip